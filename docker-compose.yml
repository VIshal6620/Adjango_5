version: '3.8'

services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"

  backend:
    build:
      context: ./sop_django
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./sop_django:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=adjango_5
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_PORT=3306

  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_DATABASE: adjango_5
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

volumes:
  mysql_data:
